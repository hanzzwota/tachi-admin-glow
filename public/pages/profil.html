<!doctype html>
<html lang="id"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profil — tachi69gmail</title><meta name="description" content="Kelola profil dan rekening." />
<script src="/toast.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7166254458926131" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head><body class="bg-mesh dark-mode min-h-screen flex flex-col items-center justify-start relative selection:bg-blue-200">

<div class="bg-sphere-1"></div><div class="bg-sphere-2"></div><div class="bg-sphere-3"></div>
<div class="w-full max-w-lg min-h-screen px-3 sm:px-4 pt-4 pb-48 flex flex-col justify-start relative z-10">
<div id="appMainNavMount"></div><main id="pageContent" class="flex-1"><div id="view-profil" class="flex flex-col gap-4 pb-24 w-full">
        <!-- Top App Header Bar -->
        <header class="flex items-center justify-between py-1">
          <div class="flex items-center gap-2.5">
            <button
              onclick="navigateTo('dashboard')"
              class="w-9 h-9 rounded-xl bg-white border border-slate-200/80 flex items-center justify-center text-slate-700 shadow-sm active:scale-90 transition"
            >
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <div>
              <h1 class="font-extrabold text-base text-slate-900 tracking-tight leading-tight">
                Profil & Pengaturan
              </h1>
            </div>
          </div>

          <button
            onclick="logout()"
            class="flex items-center gap-1 bg-rose-50 border border-rose-200/80 px-2.5 py-1.5 rounded-full text-xs font-semibold text-rose-600 shadow-sm active:scale-95 transition-transform"
          >
            <i class="fa-solid fa-right-from-bracket text-xs"></i>
            <span>Keluar</span>
          </button>
        </header>

        <button
          id="adminProfileAction"
          onclick="window.top.location.assign('/admin')"
          class="hidden w-full rounded-2xl bg-blue-600 px-4 py-3 text-left text-xs font-extrabold text-white shadow-lg shadow-blue-500/20 active:scale-[.99] transition"
        >
          <i class="fa-solid fa-shield-halved mr-2"></i>Dashboard Admin
          <span class="float-right opacity-80"><i class="fa-solid fa-arrow-right"></i></span>
        </button>

        <!-- User Status Card -->
        <div
          class="bg-white rounded-2xl p-4 card-soft-shadow border border-slate-100 flex items-center gap-4"
        >
          <div
            class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white text-2xl shadow-md shrink-0"
          >
            <i class="fa-solid fa-circle-user"></i>
          </div>
          <div class="flex flex-col gap-1">
            <span
              class="text-[10px] font-extrabold text-amber-800 bg-amber-100 border border-amber-200 px-2.5 py-0.5 rounded-full w-max flex items-center gap-1"
            >
              <i class="fa-solid fa-crown text-[10px]"></i>
              <span>STATUS: MEMBER REGULER</span>
            </span>
            <h2 id="profileDisplayName" class="text-lg font-black text-slate-800 tracking-tight">
              ryuu
            </h2>
            <p id="profileUsername" class="text-xs font-medium text-slate-400">Username: @user</p>
            <p class="text-xs font-extrabold text-blue-600 mt-1">
              Saldo: <span id="profileBalance">Rp0</span>
            </p>
          </div>
        </div>

        <!-- Keamanan Akun Card -->
        <div
          class="bg-white rounded-2xl p-4 card-soft-shadow border border-slate-100 flex flex-col gap-3"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl icon-soft-box flex items-center justify-center text-white text-base shrink-0"
            >
              <i class="fa-solid fa-lock"></i>
            </div>
            <div>
              <h3 class="text-xs font-extrabold text-slate-800">Keamanan Akun</h3>
              <p class="text-[11px] text-slate-500 font-medium">
                Perbarui kata sandi secara berkala
              </p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi Lama</label>
            <div class="custom-input rounded-xl px-3.5 py-2.5 flex items-center gap-3">
              <i class="fa-solid fa-lock text-blue-500 text-sm"></i>
              <input
                id="old-password"
                type="password"
                placeholder="••••••••"
                class="bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none w-full font-medium"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('old-password', this)"
                class="text-slate-400 hover:text-slate-600 text-xs"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Kata Sandi Baru</label>
            <div class="custom-input rounded-xl px-3.5 py-2.5 flex items-center gap-3">
              <i class="fa-solid fa-key text-blue-500 text-sm"></i>
              <input
                id="new-password"
                type="password"
                placeholder="••••••••"
                class="bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none w-full font-medium"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('new-password', this)"
                class="text-slate-400 hover:text-slate-600 text-xs"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button
            onclick="updatePassword()"
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 mt-1 active:scale-98 transition-transform shadow-md"
          >
            <i class="fa-solid fa-shield-check"></i>
            <span>Perbarui Kata Sandi</span>
          </button>
        </div>

        <!-- Rekening Penarikan Dana Card -->
        <div
          class="bg-white rounded-2xl p-4 card-soft-shadow border border-slate-100 flex flex-col gap-3"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl icon-soft-box flex items-center justify-center text-white text-base shrink-0"
            >
              <i class="fa-solid fa-building-columns"></i>
            </div>
            <div>
              <h3 class="text-xs font-extrabold text-slate-800">Rekening Penarikan Dana</h3>
              <p class="text-[11px] text-slate-500 font-medium">Dipakai saat menarik saldo</p>
            </div>
            <button
              id="editPaymentButton"
              type="button"
              onclick="setPaymentEditMode(true)"
              class="ml-auto rounded-xl bg-blue-50 px-3 py-2 text-[11px] font-extrabold text-blue-600"
            >
              <i class="fa-solid fa-pen mr-1"></i>Edit Nomor
            </button>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5"
              >Pilih Bank / E-Wallet</label
            >
            <div class="custom-input rounded-xl px-3.5 py-2.5 flex items-center">
              <select
                id="bankSelect"
                disabled
                onchange="handlePaymentModeChange(this)"
                class="bg-transparent text-xs text-slate-800 font-bold focus:outline-none w-full disabled:opacity-60"
              >
                <option value="DANA" selected>DANA</option>
                <option value="OVO">OVO</option>
                <option value="GoPay">GoPay</option>
                <option value="ShopeePay">ShopeePay</option>
                <option value="BCA">Bank BCA</option>
                <option value="BRI">Bank BRI</option>
                <option value="Mandiri">Bank Mandiri</option>
              </select>
            </div>
            <span
              id="paymentModeNotice"
              class="mt-2 block text-[11px] font-medium text-slate-500"
            ></span>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5"
              >Nomor Rekening / E-Wallet</label
            >
            <div class="custom-input rounded-xl px-3.5 py-2.5 flex items-center gap-3">
              <i class="fa-regular fa-id-card text-blue-500 text-sm"></i>
              <input
                id="rekeningInput"
                type="text"
                readonly
                placeholder="081234567890"
                oninput="
                  syncUserBankDataFromInputs();
                  updateTarikSaldoButton();
                "
                class="bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none w-full font-medium"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5"
              >Nama Pemilik Rekening</label
            >
            <div class="custom-input rounded-xl px-3.5 py-2.5 flex items-center gap-3">
              <i class="fa-regular fa-user text-blue-500 text-sm"></i>
              <input
                id="atasNamaInput"
                type="text"
                readonly
                placeholder="Sesuai buku tabungan"
                oninput="
                  syncUserBankDataFromInputs();
                  updateTarikSaldoButton();
                "
                class="bg-transparent text-xs text-slate-800 placeholder-slate-400 focus:outline-none w-full font-medium"
              />
            </div>
          </div>

          <button
            id="savePaymentButton"
            disabled
            onclick="saveBankDetails()"
            class="btn-glossy w-full text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 mt-1 active:scale-98 transition-transform opacity-50 cursor-not-allowed"
          >
            <i class="fa-solid fa-check"></i>
            <span>Simpan Data Rekening</span>
          </button>
        </div>
      </div></main>
</div>
<script src="/app-modal.js"></script><script src="/app-shell.js"></script>
<script src="/app-runtime.js"></script><script src="/api-client.js"></script>
</body></html>
