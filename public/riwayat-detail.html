<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detail Riwayat · tachi69gmail</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #eaf7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #dff4ff 0%, #edf9ff 52%, #cfeeff 100%); }
    .page { width: min(100%, 720px); margin: 0 auto; padding: 0 20px 44px; }
    .back { display: inline-flex; align-items: center; gap: 9px; margin: 0 -20px 28px; padding: 17px 20px; width: calc(100% + 40px); color: #26384c; text-decoration: none; font-size: 15px; font-weight: 700; background: rgba(255,255,255,.42); }
    .card { margin-bottom: 18px; padding: 28px; border-radius: 28px; background: rgba(255,255,255,.9); box-shadow: 0 12px 36px rgba(59,130,246,.12); }
    .eyebrow { margin: 0 0 6px; color: #8491a2; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .email { margin: 0; overflow-wrap: anywhere; color: #172033; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .stat { padding: 14px; border-radius: 17px; background: #eff9ff; }
    .stat strong { display: block; margin-top: 5px; font-size: 14px; }
    .trx { margin: 17px 0 0; color: #8491a2; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    h1 { margin: 0; font-size: 18px; }
    .timeline { margin-top: 24px; }
    .step { position: relative; display: flex; gap: 14px; min-height: 74px; }
    .step:last-child { min-height: 0; }
    .dot-wrap { position: relative; z-index: 1; width: 32px; flex: 0 0 32px; }
    .dot { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: white; font-size: 14px; font-weight: 900; box-shadow: 0 3px 10px rgba(15,23,42,.12); }
    .line { position: absolute; top: 32px; left: 15px; width: 2px; height: 42px; background: #dbe4ec; }
    .done .dot { background: #10a66a; }
    .done .line { background: #77d5b3; }
    .active .dot { background: #f2b827; }
    .rejected .dot { background: #e34857; }
    .content { padding-bottom: 22px; }
    .content h2 { margin: 3px 0 5px; font-size: 16px; }
    .content p { margin: 0; color: #707b89; font-size: 13px; line-height: 1.5; }
    .done .content h2 { color: #172033; }
    .active .content h2 { color: #9a6a00; }
    .pending .content h2 { color: #9aa5b1; }
    .rejected .content h2, .reason { color: #c62d42 !important; }
    .error { color: #c62d42; font-size: 14px; font-weight: 700; line-height: 1.5; }
    .retry { display: inline-block; margin-top: 14px; color: #1769aa; font-weight: 800; }
    @media (max-width: 480px) { .page { padding-left: 14px; padding-right: 14px; } .back { margin-left: -14px; margin-right: -14px; width: calc(100% + 28px); } .card { padding: 22px 20px; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" target="_top" href="/dashboard?view=riwayat">← <span>Kembali</span></a>
    <section class="card" id="summary"><p class="error">Memuat detail transaksi...</p></section>
    <section class="card">
      <h1>Timeline Storan</h1>
      <div class="timeline" id="timeline"></div>
    </section>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('nomortrx');
    const summary = document.getElementById('summary');
    const timeline = document.getElementById('timeline');
    const money = (value) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(value || 0));
    const date = (value) => value ? new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(new Date(value)) : 'Menunggu pemeriksaan';
    const safe = (value) => String(value ?? '-').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const showError = (message, login) => { summary.innerHTML = `<p class="error">${safe(message)}</p>${login ? '<a class="retry" target="_top" href="/auth?view=login">Masuk kembali</a>' : '<a class="retry" target="_top" href="/dashboard?view=riwayat">Kembali ke riwayat</a>'}`; timeline.innerHTML = ''; };
    const render = (deposit) => {
      const emails = Array.isArray(deposit.emails) ? deposit.emails : [];
      const accepted = Array.isArray(deposit.accepted_emails) ? deposit.accepted_emails.length : 0;
      const status = String(deposit.status || 'pending').toLowerCase();
      const approved = ['diterima', 'accepted', 'approved'].includes(status);
      const rejected = ['ditolak', 'rejected'].includes(status);
      const rate = Number(deposit.rate || 0);
      summary.innerHTML = `<p class="eyebrow">Gmail</p><p class="email">${safe(emails.join(', ') || '-')}</p><div class="grid"><div class="stat"><p class="eyebrow">Jalur</p><strong>${safe(deposit.jalur || 'PW')} · ${money(rate)}</strong></div><div class="stat"><p class="eyebrow">Tanggal Setor</p><strong>${date(deposit.submitted_at || deposit.created_at)}</strong></div></div><p class="trx">Nomor transaksi: ${safe(deposit.transaction_number || deposit.id)}</p>`;
      const steps = [
        ['Setoran Terkirim', `Gmail berhasil dikirim ke sistem · ${date(deposit.submitted_at || deposit.created_at)}`],
        ['Pending', approved || rejected ? 'Setoran telah diproses oleh admin.' : 'Menunggu untuk diproses oleh admin.'],
        [approved ? 'Disetujui' : rejected ? 'Ditolak' : 'Disetujui / Ditolak', approved ? `Saldo ${money(deposit.earned || accepted * rate)} sudah ditambahkan.` : rejected ? `Alasan: ${deposit.reason || ''}` : 'Keputusan admin belum dibuat.']
      ];
      const active = approved || rejected ? 2 : 1;
      timeline.innerHTML = steps.map((step, index) => {
        const done = approved || index < active;
        const current = !done && index === active;
        const rejectedStep = rejected && index === 3;
        const cls = rejectedStep ? 'rejected' : done ? 'done' : current ? 'active' : 'pending';
        const icon = done ? '✓' : rejectedStep ? '×' : '◷';
        const line = index < steps.length - 1 ? '<span class="line"></span>' : '';
        return `<div class="step ${cls}"><div class="dot-wrap"><span class="dot">${icon}</span>${line}</div><div class="content"><h2>${step[0]}</h2><p class="${rejectedStep ? 'reason' : ''}">${safe(step[1])}</p></div></div>`;
      }).join('');
    };
    (async () => {
      if (!id) return showError('Nomor transaksi tidak tersedia.', false);
      try {
        const response = await fetch(`/api/deposits/${encodeURIComponent(id)}`, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
        const body = await response.json().catch(() => ({}));
        if (response.status === 401) return showError('Sesi login sudah berakhir.', true);
        if (!response.ok || !body.deposit) return showError(body.error || 'Transaksi tidak ditemukan.', false);
        render(body.deposit);
      } catch (error) { showError('Gagal memuat detail. Periksa koneksi lalu coba lagi.', false); }
    })();
  </script>
</body>
</html>
